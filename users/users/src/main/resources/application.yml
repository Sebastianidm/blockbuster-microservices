spring:
  application:
    name: users
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://ep-purple-field-ambv85u7-pooler.c-5.us-east-1.aws.neon.tech/users_db?sslmode=require&channelBinding=require
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          notificationsClient:
            connectTimeout: 5000
            readTimeout: 5000

server:
  port: 8082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    root: INFO

jwt:
  secret: ${JWT_SECRET:Esta_es_una_clave_secreta_super_larga_y_segura_para_el_proyecto_blockbuster_2026}
  expiration: ${JWT_EXPIRATION:86400000}

internal:
  api:
    key: ${INTERNAL_API_KEY:change-this-internal-api-key}

notifications:
  service:
    url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:8084}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
