spring:
  application:
    name: transactions
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://ep-purple-field-ambv85u7-pooler.c-5.us-east-1.aws.neon.tech/transactions_db?sslmode=require&channelBinding=require
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          usersClient:
            connectTimeout: 5000
            readTimeout: 5000
          catalogClient:
            connectTimeout: 5000
            readTimeout: 5000
          notificationsClient:
            connectTimeout: 5000
            readTimeout: 5000
      httpclient:
        hc5:
          enabled: true

server:
  port: ${PORT:${SERVER_PORT:8083}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

users:
  service:
    url: ${USERS_SERVICE_URL:http://${USERS_SERVICE_HOSTPORT:localhost:8082}}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://${CATALOG_SERVICE_HOSTPORT:localhost:8081}}

notifications:
  service:
    url: ${NOTIFICATIONS_SERVICE_URL:http://${NOTIFICATIONS_SERVICE_HOSTPORT:localhost:8084}}

internal:
  api:
    key: ${INTERNAL_API_KEY:change-this-internal-api-key}

jwt:
  secret: ${JWT_SECRET:Esta_es_una_clave_secreta_super_larga_y_segura_para_el_proyecto_blockbuster_2026}
  expiration: ${JWT_EXPIRATION:86400000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${EUREKA_SERVER_HOSTPORT:localhost:8761}/eureka}
