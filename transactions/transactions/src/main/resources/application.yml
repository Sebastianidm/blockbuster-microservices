server:
  port: 8083

spring:
  application:
    name: transactions
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://ep-purple-field-ambv85u7-pooler.c-5.us-east-1.aws.neon.tech/transactions_db?sslmode=require&channelBinding=require
    username: "${DB_USERNAME:neondb_owner}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          usersClient:
            connectTimeout: 5000
            readTimeout: 5000
          catalogClient:
            connectTimeout: 5000
            readTimeout: 5000
          notificationsClient:
            connectTimeout: 5000
            readTimeout: 5000
      httpclient:
        hc5:
          enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

users:
  service:
    url: "${USERS_SERVICE_URL:http://localhost:8082}"

catalog:
  service:
    url: "${CATALOG_SERVICE_URL:http://localhost:8081}"

notifications:
  service:
    url: "${NOTIFICATIONS_SERVICE_URL:http://localhost:8084}"

internal:
  api:
    key: "${INTERNAL_API_KEY:change-this-internal-api-key}"

jwt:
  secret: "${JWT_SECRET:Esta_es_una_clave_secreta_super_larga_y_segura_para_el_proyecto_blockbuster_2026}"
  expiration: "${JWT_EXPIRATION:86400000}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      catalogClient:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
      usersClient:
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
