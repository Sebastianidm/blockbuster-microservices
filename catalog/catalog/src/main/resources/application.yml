spring:
  application:
    name: catalog
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://ep-purple-field-ambv85u7-pooler.c-5.us-east-1.aws.neon.tech/catalog_db?sslmode=require&channelBinding=require
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:${SERVER_PORT:8081}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    root: INFO

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-env-with-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}

internal:
  api:
    key: ${INTERNAL_API_KEY:change-this-internal-api-key}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${EUREKA_SERVER_HOSTPORT:localhost:8761}/eureka}
