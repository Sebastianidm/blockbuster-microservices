spring:
  config:
    activate:
      on-profile: render
  cloud:
    gateway:
      default-filters:
        - TokenRelay
      routes:
        - id: catalog
          uri: http://${CATALOG_ROUTE_HOSTPORT:catalog:8081}
          predicates:
            - Path=/api/v1/movies/**, /api/v1/categories/**, /api/v1/catalog/**

        - id: users
          uri: http://${USERS_ROUTE_HOSTPORT:users:8082}
          predicates:
            - Path=/api/v1/users/**, /api/v1/auth/**

        - id: transactions
          uri: http://${TRANSACTIONS_ROUTE_HOSTPORT:transactions:8083}
          predicates:
            - Path=/api/v1/rentals/**

        - id: notifications
          uri: http://${NOTIFICATIONS_ROUTE_HOSTPORT:notifications:8084}
          predicates:
            - Path=/api/v1/notifications/**
